packages:
  - "."

overrides:
  "@types/react": "19.2.17"
  "@types/react-dom": "19.2.3"
  esbuild: "0.28.1"
  h3: ">=2.0.1-rc.18"
  h3-v2: "npm:h3@>=2.0.1-rc.18"
  picomatch: "^4.0.4"

allowBuilds:
  "@tailwindcss/oxide": true
  core-js: false
  core-js-pure: false
  esbuild: true
  unrs-resolver: true

blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - nitro
  - srvx
  - vite
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 129600
